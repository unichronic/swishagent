services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swishagent
    ports:
      - "5432:5432"
    volumes:
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 96M
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: uvicorn agent_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - DATA_API_URL=http://data:8081
      - REDIS_ADDR=redis:6379
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - AGENT_SERVICE_URL=http://agent:8001
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis
      - agent
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  data:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: uvicorn data_service:app --host 0.0.0.0 --port 8081
    ports:
      - "8081:8081"
    environment:
      - DB_URL=postgresql://postgres:postgres@postgres:5432/swishagent
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data:
